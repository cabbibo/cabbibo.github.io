<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retention Surface</title>
<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
<div id="boot">Running survival model<div class="bar"><i></i></div></div>
<div id="stage"></div>
<div class="vignette"></div>

<div class="title-block">
  <p class="eyebrow">13 · Conduct &amp; Safety</p>
  <h1 class="viz">Retention <em>Surface</em></h1>
  <p class="lede">A Kaplan&ndash;Meier estimate is a staircase down. Put three arms side by side and the gap between them is the whole trial &mdash; but only if enough patients are still at risk to believe it.</p>
</div>

<div class="panel panel-r">
  <h4>Survival model</h4>
  <div id="ctrls"></div>
</div>

<div class="panel panel-l">
  <h4>Readout</h4>
  <div id="stats"></div>
  <hr class="sep">
  <div id="atrisk"></div>
</div>

<script src="../assets/vendor/three.min.js"></script>
<script src="../assets/js/land.js"></script>
<script src="../assets/js/lmviz.js"></script>
<script>
(function(){
LM.chrome('13-retention');

var ARMS = [
  {k:'A', label:'Investigational 200 mg', c:LM.C.accent, z: 2.6, median:14.5, size:960},
  {k:'B', label:'Investigational 100 mg', c:LM.C.violet, z: 0.0, median:11.8, size:480},
  {k:'C', label:'Placebo',                c:LM.C.slate,  z:-2.6, median: 8.2, size:960}
];
var MONTHS = 36, SX = 0.46, SY = 6.2;

var ctx = LM.boot({
  cam:[0,6,19], fov:36, fit:9.6, fitMargin:1.08,
  orbit:{ target:new THREE.Vector3(0,2.4,0), minDist:8, maxDist:52,
          autoRotate:true, autoRotateSpeed:0.055, minPolar:0.18, maxPolar:1.7 },
  fog:[26,80]
});
if(!ctx) return;
LM.studio(ctx.scene,{hemi:0.78,key:0.64,fill:0.24,rim:0.14});

function X(m){ return -MONTHS*SX/2 + m*SX; }
function Y(s){ return s*SY; }

/* ---------- axes ---------- */
(function(){
  var pts=[];
  for (var m=0;m<=MONTHS;m+=6){ pts.push(X(m),0,-4.1, X(m),0,4.1); pts.push(X(m),0,-4.1, X(m),Y(1),-4.1); }
  for (var s=0;s<=1.001;s+=0.25){ pts.push(X(0),Y(s),-4.1, X(MONTHS),Y(s),-4.1); }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  ctx.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:LM.C.ink,transparent:true,opacity:0.08})));

  for (var m=0;m<=MONTHS;m+=6){
    var l=LM.label(m+'mo',{size:26,weight:600,color:'#8d97a3',scale:0.66,depthTest:false});
    l.position.set(X(m),-0.42,4.5); ctx.add(l);
  }
  for (var s=0;s<=1.001;s+=0.25){
    var l2=LM.label(Math.round(s*100)+'%',{size:26,weight:600,color:'#8d97a3',scale:0.66,depthTest:false});
    l2.position.set(X(0)-1.0,Y(s),-4.1); ctx.add(l2);
  }
})();

/* ---------- survival simulation ---------- */
var dropout = 0.10, followUp = 30, nScale = 1.0;
var curves = [], atRisk = [], stats = {};

function simulate(){
  curves = []; atRisk = [];
  var allEvents = [];
  ARMS.forEach(function(A, ai){
    var rnd = LM.rng(500+ai*131);
    var n = Math.round(A.size*nScale);
    var lambda = Math.log(2)/A.median;          // exponential event hazard
    var dHaz = -Math.log(1-dropout)/12;          // annualised dropout -> monthly hazard
    var recs = [];
    for (var i=0;i<n;i++){
      var tEvent = -Math.log(1-rnd())/lambda;
      var tDrop  = -Math.log(1-rnd())/dHaz;
      var tAdmin = followUp;
      var t = Math.min(tEvent, tDrop, tAdmin);
      var ev = (t === tEvent);
      recs.push({t:t, ev:ev});
      allEvents.push({t:t, ev:ev, arm:ai});
    }
    recs.sort(function(a,b){return a.t-b.t;});

    // Kaplan-Meier
    var s = 1, atR = recs.length, km = [{t:0, s:1, atRisk:atR}];
    var i = 0;
    while (i < recs.length){
      var t = recs[i].t, d = 0, c = 0;
      while (i < recs.length && recs[i].t === t){ if (recs[i].ev) d++; else c++; i++; }
      // count all records at this exact time
      if (d > 0){ s *= (1 - d/atR); }
      atR -= (d + c);
      km.push({t:t, s:s, atRisk:Math.max(atR,0)});
    }
    km.push({t:followUp, s:s, atRisk:Math.max(atR,0)});

    // median survival
    var med = null;
    for (var k=0;k<km.length;k++) if (km[k].s <= 0.5){ med = km[k].t; break; }

    curves.push({arm:A, km:km, n:n, events:recs.filter(function(r){return r.ev;}).length, median:med});

    var row=[];
    for (var m=0;m<=MONTHS;m+=6){
      var ar = recs.filter(function(r){return r.t >= m;}).length;
      row.push(ar);
    }
    atRisk.push(row);
  });

  // log-rank, arm A vs placebo (arm C)
  var pair = allEvents.filter(function(e){return e.arm===0||e.arm===2;}).sort(function(a,b){return a.t-b.t;});
  var nA = curves[0].n, nC = curves[2].n;
  var O=0, E=0, V=0;
  var idx=0;
  while (idx < pair.length){
    var t = pair[idx].t, dA=0, dC=0, cA=0, cC=0;
    while (idx<pair.length && pair[idx].t===t){
      var e=pair[idx];
      if (e.arm===0){ if(e.ev) dA++; else cA++; } else { if(e.ev) dC++; else cC++; }
      idx++;
    }
    var d = dA+dC, nTot = nA+nC;
    if (d>0 && nTot>1 && nA>0 && nC>0){
      O += dA;
      E += d*nA/nTot;
      V += d*(nA/nTot)*(nC/nTot)*(nTot-d)/(nTot-1);
    }
    nA -= (dA+cA); nC -= (dC+cC);
    if (nA<=0 || nC<=0) break;
  }
  var chi = V>0 ? (O-E)*(O-E)/V : 0;
  // two-sided p from a 1-df chi-square (Wilson-Hilferty style approximation)
  var z = Math.sqrt(Math.max(chi,0));
  var p = 2*(1-normCdf(z));
  var hr = (V>0) ? Math.exp((O-E)/V) : 1;

  stats = {chi:chi, p:p, hr:hr};
}
function normCdf(x){
  var t = 1/(1+0.2316419*Math.abs(x));
  var d = 0.3989423*Math.exp(-x*x/2);
  var pr = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return x > 0 ? 1-pr : pr;
}
simulate();

/* ---------- geometry ---------- */
var ribbons = [], fills = [], ciBands = [];
function buildCurves(){
  ribbons.forEach(function(o){ ctx.scene.remove(o); o.geometry.dispose(); o.material.dispose(); });
  fills.forEach(function(o){ ctx.scene.remove(o); o.geometry.dispose(); o.material.dispose(); });
  ribbons=[]; fills=[];

  curves.forEach(function(C){
    var A = C.arm, km = C.km;
    var line=[], tri=[];
    var prevS = 1, prevT = 0;
    for (var i=0;i<km.length;i++){
      var t = Math.min(km[i].t, MONTHS), s = km[i].s;
      // horizontal then vertical => the staircase
      line.push(X(prevT), Y(prevS), A.z, X(t), Y(prevS), A.z);
      line.push(X(t), Y(prevS), A.z, X(t), Y(s), A.z);
      // filled skirt under the step
      tri.push(X(prevT), Y(prevS), A.z,  X(t), Y(prevS), A.z,  X(prevT), 0, A.z);
      tri.push(X(t), Y(prevS), A.z,      X(t), 0, A.z,         X(prevT), 0, A.z);
      prevS = s; prevT = t;
      if (t >= MONTHS) break;
    }
    var lg=new THREE.BufferGeometry();
    lg.setAttribute('position',new THREE.Float32BufferAttribute(line,3));
    var lm=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:A.c, transparent:true, opacity:0.95}));
    ctx.add(lm); ribbons.push(lm);

    var fg=new THREE.BufferGeometry();
    fg.setAttribute('position',new THREE.Float32BufferAttribute(tri,3));
    fg.computeVertexNormals();
    var fm=new THREE.Mesh(fg,new THREE.MeshBasicMaterial({color:A.c, transparent:true, opacity:0.10, side:THREE.DoubleSide, depthWrite:false}));
    ctx.add(fm); fills.push(fm);
  });
}
buildCurves();

var armLabels=[];
function buildLabels(){
  armLabels.forEach(function(l){ ctx.scene.remove(l); l.material.map.dispose(); l.material.dispose(); });
  armLabels=[];
  curves.forEach(function(C){
    var A=C.arm;
    var last = C.km[C.km.length-1];
    var l=LM.label(A.label,{size:30,weight:700,color:'#'+A.c.toString(16).padStart(6,'0'),scale:0.78,depthTest:false});
    l.position.set(X(MONTHS)+0.3+l.scale.x/2, Y(last.s), A.z);
    ctx.add(l); armLabels.push(l);
    var m=LM.label(C.median?('median '+C.median.toFixed(1)+' mo'):'median not reached',
      {size:24,weight:600,color:'#8d97a3',scale:0.64,depthTest:false});
    m.position.set(X(MONTHS)+0.3+l.scale.x/2, Y(last.s)-0.52, A.z);
    ctx.add(m); armLabels.push(m);
  });
}
buildLabels();

/* ---------- censoring ticks ---------- */
var tickMesh=null;
function buildTicks(){
  if (tickMesh){ ctx.scene.remove(tickMesh); tickMesh.geometry.dispose(); tickMesh.material.dispose(); }
  var pts=[], cols=[], C3=new THREE.Color();
  curves.forEach(function(C){
    var A=C.arm;
    var seen = {};
    C.km.forEach(function(k,i){
      if (i===0 || k.t>MONTHS) return;
      if (i%4!==0) return;        // thin them out so the chart stays readable
      pts.push(X(k.t), Y(k.s)-0.10, A.z, X(k.t), Y(k.s)+0.10, A.z);
      C3.setHex(A.c);
      cols.push(C3.r,C3.g,C3.b, C3.r,C3.g,C3.b);
    });
  });
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  tickMesh=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.45}));
  ctx.add(tickMesh);
}
buildTicks();

/* ---------- UI ---------- */
var ctrls=document.getElementById('ctrls');
ARMS.forEach(function(A,i){
  LM.ui.slider(ctrls,{label:A.label+' median', min:3, max:30, step:0.5, value:A.median,
    plain:'The typical time before this group’s disease gets worse. Half the patients last longer than this, half shorter. Drag the drug groups apart from placebo and watch the result become significant.',
    fmt:function(v){return v.toFixed(1)+' mo';},
    on:function(v){ A.median=v; rebuild(); }});
});
LM.ui.slider(ctrls,{label:'Annual dropout', min:0, max:0.5, step:0.01, value:0.10,
  plain:'How many patients disappear each year — they move, lose interest, or get too unwell to attend. You never find out what happened to them, which is why dropout is so damaging.',
  fmt:function(v){return (v*100).toFixed(0)+'%';}, on:function(v){ dropout=v; rebuild(); }});
LM.ui.slider(ctrls,{label:'Follow-up cap', min:6, max:36, step:1, value:30,
  plain:'How long you keep watching before you stop and analyse. Stop too early and you have not seen enough events to tell the groups apart.',
  fmt:function(v){return v+' mo';}, on:function(v){ followUp=v; rebuild(); }});
LM.ui.slider(ctrls,{label:'Sample size', min:0.15, max:2, step:0.05, value:1,
  plain:'How many patients are in the trial. Drag it down and watch the lines get jagged and the result stop being convincing — that is what an underpowered trial looks like.',
  fmt:function(v){return Math.round(2400*v)+' pts';}, on:function(v){ nScale=v; rebuild(); }});

var setStat=LM.ui.stats(document.getElementById('stats'),[
  {k:'Hazard ratio', id:'hr', accent:true, plain:'How much the drug reduces the risk at any given moment. 0.56 means roughly a 44% lower chance of getting worse. 1.00 would mean the drug does nothing at all.'},
  {k:'Log-rank p', id:'p', plain:'The chance you would see a gap this big purely by luck if the drug did nothing. Below 0.05 is the usual bar for calling it real.'},
  {k:'Events', id:'ev', plain:'How many patients actually got worse. Counter-intuitively, survival trials are powered by events, not patients — no events means no answer.'},
  {k:'Median A', id:'ma', plain:'The typical time before getting worse on the full-dose drug. "NR" means over half were still fine when the trial stopped, which is a good problem.'},
  {k:'Median C', id:'mc', plain:'The same figure for the dummy pill. The gap between this and the drug is the entire value of the medicine.'},
  {k:'Censored', id:'cen', plain:'The share of patients whose final outcome you never saw — they left, or the trial ended while they were still fine. The little ticks on the lines mark them.'}
]);

var atRiskEl=document.getElementById('atrisk');
function refresh(){
  var totEv = curves.reduce(function(a,c){return a+c.events;},0);
  var totN = curves.reduce(function(a,c){return a+c.n;},0);
  setStat('hr', stats.hr.toFixed(2));
  setStat('p', stats.p<0.0001?'&lt;0.0001':stats.p.toFixed(4));
  setStat('ev', LM.fmt(totEv));
  setStat('ma', curves[0].median?curves[0].median.toFixed(1)+'<small>mo</small>':'NR');
  setStat('mc', curves[2].median?curves[2].median.toFixed(1)+'<small>mo</small>':'NR');
  setStat('cen', LM.pct(1-totEv/totN,0));

  var head='<tr><td style="color:var(--faint);font-size:9.5px;font-weight:700;letter-spacing:.1em">AT RISK</td>'+
    atRisk[0].map(function(_,i){return '<td style="color:var(--faint);font-size:9.5px;text-align:right">'+(i*6)+'</td>';}).join('')+'</tr>';
  var rows = curves.map(function(C,ci){
    var c='#'+C.arm.c.toString(16).padStart(6,'0');
    return '<tr><td style="color:'+c+';font-weight:700;font-size:10.5px">'+C.arm.k+'</td>'+
      atRisk[ci].map(function(v){return '<td style="text-align:right;font-family:var(--mono);font-size:10px;color:var(--muted)">'+v+'</td>';}).join('')+'</tr>';
  }).join('');
  atRiskEl.innerHTML='<table style="width:100%;border-collapse:collapse">'+head+rows+'</table>'+
    (stats.p<0.05
      ? '<p class="note" style="margin-top:8px;color:#3bb974"><b>Separation is significant</b> at the 5% level.</p>'
      : '<p class="note" style="margin-top:8px;color:#ed9e2f"><b>Not significant.</b> Increase sample size or follow-up.</p>');
}
refresh();

function rebuild(){
  simulate(); buildCurves(); buildLabels(); buildTicks(); refresh();
}

ctx.onFrame(function(dt,t){
  ribbons.forEach(function(r,i){
    r.material.opacity = 0.88 + 0.10*Math.sin(t*1.3 + i*1.1);
  });
});
})();
</script>
</body>
</html>
